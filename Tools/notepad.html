<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>记事本</title>
    </head>
    <body>
        <h1>简单的记事本工具</h1>
        <textarea id="notepad" style="width:100%; height:80vh;"></textarea>
        <br>
        <button onclick="saveNote()">保存笔记</button>
        <button onclick="loadNote()">加载笔记</button>

        <script>
            function saveNote() {
                const noteContent = document.getElementById('notepad').value;
                localStorage.setItem('notepadContent', noteContent);
                alert('笔记已保存！');
            }

            function loadNote() {
                const savedContent = localStorage.getItem('notepadContent');
                if (savedContent) {
                    document.getElementById('notepad').value = savedContent;
                    alert('笔记已加载！');
                } else {
                    alert('没有找到已保存的笔记。');
                }
            }
        </script>
    </body>
</html>
